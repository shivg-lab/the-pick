services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_MODE: ${APP_MODE:-demo}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      SPORTRADAR_API_KEY: ${SPORTRADAR_API_KEY:-}
      SPORTRADAR_FEED_PATH: ${SPORTRADAR_FEED_PATH:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./backend/data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
